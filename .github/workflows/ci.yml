name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked project metadata
        run: npm ci

      - name: Resolve preinstalled Chromium browser
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "BROWSER_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "BROWSER_BIN=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "No Chromium-family browser is available on the runner." >&2
            exit 1
          fi

      - name: Run complete web quality gate
        run: npm run check

  graph-integrity:
    name: Graph integrity · Python
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install JSON Schema validator
        run: python3 -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Validate graph integrity and schemas
        run: python3 scripts/validate_graph_integrity.py

  lean:
    name: Lean · mathlib
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Build and check Lean package
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          mk_all-check: true
          build-args: --wfail
          use-mathlib-cache: true
          leanchecker: false
